name: Availability — Globalping
run-name: ${{ inputs.external_run_id && format('External monitor {0}', inputs.external_run_id) || 'Availability — Globalping' }}
on:
  workflow_dispatch:
    inputs:
      external_run_id:
        description: 'Correlation ID from the existing-VM clock (leave empty for a manual run)'
        required: false
        type: string
        default: ''
      test_alert:
        description: 'Send a clearly labelled test notification to the owner'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['*.mjs', '*.py', '.github/workflows/availability.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: availability
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'KlochkovN/masterskaya-monitoring'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test monitoring logic
        run: |
          node --test
          python3 -m unittest discover -s . -p 'test_dispatch_runner.py'
      - name: Check public endpoints
        run: node monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          TEST_ALERT: ${{ inputs.test_alert == true && 'true' || 'false' }}
